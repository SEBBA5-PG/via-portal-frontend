services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: via_portal
      POSTGRES_PASSWORD: via_portal_dev
      POSTGRES_DB: via_portal
    ports:
      - "5432:5432"
    volumes:
      - via_portal_db:/var/lib/postgresql/data

volumes:
  via_portal_db:
